name: Fetch Pets

on:
  schedule:
    - cron: '0 13 * * *' # Adjust if needed
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run fetch script
        env:
          SHELTERLUV_API_KEY: ${{ secrets.SHELTERLUV_API_KEY }}
        run: node your-fetch-script.js # Make sure this matches your actual fetch script filename

      - name: Commit and push changes if data updated
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update pet data" && git push)
