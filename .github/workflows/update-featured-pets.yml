name: Update Featured Pets

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch: # Allows you to manually trigger it from GitHub anytime

jobs:
  update-pets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run Pet Fetcher Script
        env:
          SHELTERLUV_API_KEY: ${{ secrets.SHELTERLUV_API_KEY }}
        run: |
          node scripts/fetch-featured-pets.js

      - name: Commit and push if changed
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'bot@users.noreply.github.com'
          git add content/home/featured-pets.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update featured pets [skip ci]" && git push)
