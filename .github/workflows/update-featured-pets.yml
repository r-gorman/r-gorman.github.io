name: Daily Shelterluv Audit

on:
  schedule:
    - cron: '0 13 * * *' # Runs daily at 8:00 AM Central (13:00 UTC)
  workflow_dispatch: # Allows manual triggers from GitHub anytime

jobs:
  audit:
    runs-on: ubuntu-latest
  
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Audit Script
        env:
          SHELTERLUV_API_KEY: ${{ secrets.SHELTERLUV_API_KEY }}
        run: node scripts/diff-check.js  # Make sure this matches your actual script file name!

      - name: Check for changes and commit updated snapshot
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add animal_snapshot.json all_changes_summary.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update animal snapshot and change log" && git push)

      - name: Send Email Report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🐾 Shelterluv Daily Change Report"
          to: "rachelrgomez97@gmail.com.com"
          from: "Shelterluv Bot"
          body: "Attached is the latest field-level change log for Shelterluv records."
          attachments: |
            all_changes_summary.txt
