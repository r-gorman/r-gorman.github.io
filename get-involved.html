<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Involved | Jak's Second Chance Rescue Ranch</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Include js-yaml to parse front matter markdown -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
</head>

<body>

<header>
    <a href="index.html" class="logo-section" style="text-decoration: none; display: flex; align-items: center; gap: 1rem;">
        <img src="images/logo.png" alt="Jak's Second Chance Rescue Ranch Logo">
        <h1>Jak's Second Chance Rescue Ranch</h1>
    </a>
    
    <!-- Mobile hamburger menu toggle elements -->
    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label for="nav-toggle" class="nav-toggle-label">
        <span></span>
        <span></span>
        <span></span>
    </label>

    <nav id="mainNav">
        <a href="index.html">Home</a>
        <a href="adopt.html">Adopt</a>
        <a href="get-involved.html" class="active">Get Involved</a>
        <a href="about.html">About Us</a>
        <a href="donate.html">Donate</a>
        <a href="contact.html">Contact Us</a>
    </nav>
</header>

<main>
    <section class="help-section" style="padding: 5rem 1.5rem; background: #ffffff;">
        <div class="help-container" style="max-width: 900px; margin: 0 auto;">
            <div style="text-align: center; margin-bottom: 3rem;">
                <h2 id="hero-title" style="color: var(--logo-brown); font-size: 2.5rem; margin-bottom: 1rem;">Become a Foster Hero</h2>
                <p id="hero-text" style="color: #594f47; font-size: 1.15rem; line-height: 1.7; max-width: 800px; margin: 0 auto;">
                    Loading...
                </p>
            </div>

            <!-- What We Provide Callout -->
            <div style="background: #f7f1ec; padding: 2.5rem; border-radius: 10px; border: 1px solid var(--border-color); margin-bottom: 3rem;">
                <h3 id="cover-title" style="color: var(--logo-brown); margin-top: 0; margin-bottom: 0.75rem; font-size: 1.4rem;">We Cover Everything</h3>
                <p id="cover-text" style="color: #594f47; font-size: 1.05rem; line-height: 1.7; margin: 0;">
                    Loading...
                </p>
            </div>

            <!-- Foster Application Form Embed -->
            <div style="background: #fcfbfa; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; margin-bottom: 4rem;">
                <iframe id="foster-embed" src="" width="100%" height="1300" frameborder="0" marginheight="0" marginwidth="0" title="Jak's Second Chance Rescue Ranch Foster Application">Loading…</iframe>
            </div>
        </div>
    </section>

    <section class="help-section" style="padding: 5rem 1.5rem; background: #f7f1ec;">
        <div class="help-container" style="max-width: 900px; margin: 0 auto; text-align: center;">
            <h2 id="other-title" style="color: var(--logo-brown); font-size: 2.2rem; margin-bottom: 1rem;">Other Ways to Help</h2>
            <p id="other-text" style="color: #594f47; font-size: 1.1rem; line-height: 1.7; max-width: 750px; margin: 0 auto 2.5rem auto;">
                Loading...
            </p>
            <a href="contact.html" class="button btn-primary" style="display: inline-block; padding: 1rem 2rem; font-size: 1.05rem; box-shadow: 0 2px 6px rgba(230, 126, 53, 0.2);">Contact Us to Volunteer</a>
        </div>
    </section>
</main>

<footer style="padding: 2.5rem 1rem; text-align: center; background: #2b221e; color: #fff;">
    <p>&copy; 2026 Jak's Second Chance Rescue Ranch. Saving lives in Central Arkansas.</p>
</footer>

<script>
    async function loadGetInvolvedContent() {
        try {
            const response = await fetch('content/get-involved/get-involved.md');
            if (!response.ok) throw new Error('Could not load content/get-involved.md');
            const markdownText = await response.text();
            
            const parts = markdownText.split('---');
            if (parts.length >= 2) {
                const data = jsyaml.load(parts[1]);

                document.getElementById('hero-title').textContent = data.hero_title || '';
                document.getElementById('hero-text').textContent = data.hero_text || '';
                document.getElementById('cover-title').textContent = data.cover_title || '';
                document.getElementById('cover-text').textContent = data.cover_text || '';
                
                if (data.foster_embed_url) {
                    document.getElementById('foster-embed').src = data.foster_embed_url;
                }

                document.getElementById('other-title').textContent = data.other_title || '';
                document.getElementById('other-text').textContent = data.other_text || '';
            }
        } catch (error) {
            console.error('Error loading CMS content:', error);
        }
    }

    loadGetInvolvedContent();
</script>

</body>
</html>
