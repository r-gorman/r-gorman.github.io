backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Website Pages"
    folder: "content"
    create: false
    summary: "Homepage"
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "home"}
      
      # --- Hero Section ---
      - {label: "Hero Title", name: "hero_title", widget: "string"}
      - {label: "Hero Text", name: "hero_text", widget: "text"}

      # --- Impact Statistics ---
      - {label: "Dogs Rescued Stat", name: "stats_rescued", widget: "string"}
      - {label: "Active Foster Homes Stat", name: "stats_fosters", widget: "string"}
      - {label: "Successful Adoptions Stat", name: "stats_adoptions", widget: "string"}

      # --- About / Mission Description ---
      - {label: "Main Description Text", name: "about_text", widget: "text"}

      # --- Featured Animals ---
      - label: "Featured Animals"
        name: "featured_animals"
        widget: "list"
        fields:
          - {label: "Dog Name", name: "name", widget: "string"}
          - {label: "Dog Picture", name: "image", widget: "image"}
          - {label: "Dog Bio Text", name: "text", widget: "text"}
          - {label: "View Profile & Apply Link", name: "link", widget: "string"}

      # --- How You Can Help Section ---
      - {label: "How You Can Help Title", name: "help_title", widget: "string"}
      - {label: "How You Can Help Subtitle", name: "help_subtitle", widget: "text"}
      
      - label: "Apply to Foster Card"
        name: "card_foster"
        widget: "object"
        fields:
          - {label: "Card Title", name: "title", widget: "string"}
          - {label: "Card Text", name: "text", widget: "text"}

      - label: "Adoption Application Card"
        name: "card_adopt"
        widget: "object"
        fields:
          - {label: "Card Title", name: "title", widget: "string"}
          - {label: "Card Text", name: "text", widget: "text"}

      - label: "Support Our Mission Card"
        name: "card_support"
        widget: "object"
        fields:
          - {label: "Card Title", name: "title", widget: "string"}
          - {label: "Card Text", name: "text", widget: "text"}

      # --- Connect With Us Online ---
      - {label: "Connect With Us Online Title", name: "connect_title", widget: "string"}
      - {label: "Connect With Us Online Text", name: "connect_text", widget: "text"}

  - name: "about_page"
    label: "About Page"
    folder: "content"
    create: false
    summary: "About Page"
    filter: {field: "layout", value: "about"}
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "about"}
      - {label: "Who We Are Title", name: "who_title", widget: "string"}
      - {label: "Who We Are Text", name: "who_text", widget: "text"}
      - {label: "Mission & Values Title", name: "mission_title", widget: "string"}
      - {label: "Mission & Values Subtitle Text", name: "mission_text", widget: "text"}
      
      - label: "Rescue and Rehabilitation Card"
        name: "card_rescue"
        widget: "object"
        fields:
          - {label: "Card Title", name: "title", widget: "string"}
          - {label: "Card Text", name: "text", widget: "text"}

      - label: "Foster Network Card"
        name: "card_foster_network"
        widget: "object"
        fields:
          - {label: "Card Title", name: "title", widget: "string"}
          - {label: "Card Text", name: "text", widget: "text"}

      - label: "Lifelong Matches Card"
        name: "card_matches"
        widget: "object"
        fields:
          - {label: "Card Title", name: "title", widget: "string"}
          - {label: "Card Text", name: "text", widget: "text"}
  
  - name: "adopt_page"
    label: "Adopt Page"
    folder: "content"
    create: false
    summary: "Adopt Page"
    filter: {field: "layout", value: "adopt"}
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "adopt"}
      - {label: "Hero Title", name: "hero_title", widget: "string"}
      - {label: "Hero Text", name: "hero_text", widget: "text"}
      - {label: "Adopt-a-Pet Embed URL", name: "adopt_embed_url", widget: "string"}
      - {label: "Process Section Title", name: "process_title", widget: "string"}
      - {label: "Process Section Subtitle", name: "process_text", widget: "text"}

      - label: "Submit Application Card"
        name: "card_app"
        widget: "object"
        fields:
          - {label: "Card Title", name: "title", widget: "string"}
          - {label: "Card Text", name: "text", widget: "text"}
          - {label: "Google Form Embed URL", name: "embed_url", widget: "string"}

      - label: "Meet & Greet Card"
        name: "card_meet"
        widget: "object"
        fields:
          - {label: "Card Title", name: "title", widget: "string"}
          - {label: "Card Text", name: "text", widget: "text"}

      - label: "Foster-to-Adopt Card"
        name: "card_foster"
        widget: "object"
        fields:
          - {label: "Card Title", name: "title", widget: "string"}
          - {label: "Card Text", name: "text", widget: "text"}

      - label: "Have Questions Card"
        name: "card_questions"
        widget: "object"
        fields:
          - {label: "Card Title", name: "title", widget: "string"}
          - {label: "Card Text", name: "text", widget: "text"}

  - name: "get_involved_page"
    label: "Get Involved Page"
    folder: "content"
    create: false
    summary: "Get Involved Page"
    filter: {field: "layout", value: "get-involved"}
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "get-involved"}
      - {label: "Become a Foster Title", name: "hero_title", widget: "string"}
      - {label: "Become a Foster Text", name: "hero_text", widget: "text"}
      - {label: "We Cover Everything Title", name: "cover_title", widget: "string"}
      - {label: "We Cover Everything Text", name: "cover_text", widget: "text"}
      - {label: "Foster Application Google Form Embed URL", name: "foster_embed_url", widget: "string"}
      - {label: "Other Ways to Help Title", name: "other_title", widget: "string"}
      - {label: "Other Ways to Help Text", name: "other_text", widget: "text"}

  - name: "donate_page"
    label: "Donate Page"
    folder: "content"
    create: false
    summary: "Donate Page"
    filter: {field: "layout", value: "donate"}
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "donate"}
      - {label: "Support Our Mission Title", name: "donate_title", widget: "string"}
      - {label: "Support Our Mission Subtitle Text", name: "donate_text", widget: "text"}

      - label: "Direct Digital Giving Card"
        name: "card_giving"
        widget: "object"
        fields:
          - {label: "Card Title", name: "title", widget: "string"}
          - {label: "Card Subtitle Text", name: "text", widget: "text"}
          - {label: "Amazon Wishlist URL", name: "amazon_url", widget: "string"}
          - {label: "Venmo URL", name: "venmo_url", widget: "string"}
          - {label: "PayPal URL", name: "paypal_url", widget: "string"}
          - {label: "CashApp URL", name: "cashapp_url", widget: "string"}

  - name: "contact_page"
    label: "Contact Page"
    folder: "content"
    create: false
    summary: "Contact Page"
    filter: {field: "layout", value: "contact"}
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "contact"}
      - {label: "Get in Touch Title", name: "contact_title", widget: "string"}
      - {label: "Get in Touch Text", name: "contact_text", widget: "text"}

      - label: "Message Us Card"
        name: "card_message"
        widget: "object"
        fields:
          - {label: "Card Title", name: "title", widget: "string"}
          - {label: "Card Text", name: "text", widget: "text"}
          - {label: "Link Label", name: "link_text", widget: "string"}
          - {label: "Link URL", name: "link_url", widget: "string"}

      - label: "Email Us Card"
        name: "card_email"
        widget: "object"
        fields:
          - {label: "Card Title", name: "title", widget: "string"}
          - {label: "Card Text", name: "text", widget: "text"}
          - {label: "Email Address Text", name: "link_text", widget: "string"}
          - {label: "Email URL (mailto)", name: "link_url", widget: "string"}

      - label: "Location Card"
        name: "card_location"
        widget: "object"
        fields:
          - {label: "Card Title", name: "title", widget: "string"}
          - {label: "Main Location Text", name: "text_main", widget: "string"}
          - {label: "Sub Location Text", name: "text_sub", widget: "string"}

      - label: "Connect With Us Online Card"
        name: "card_connect"
        widget: "object"
        fields:
          - {label: "Card Title", name: "title", widget: "string"}
          - {label: "Card Text", name: "text", widget: "text"}
          - {label: "Facebook URL", name: "facebook_url", widget: "string"}
          - {label: "Instagram URL", name: "instagram_url", widget: "string"}